<!DOCTYPE html>
<html>
<head>

    <title>Form In Html</title>
</head>

<body>
    <form action="">
        <fieldset>
            <legend>

                <h2>Student Information</h2>

            </legend>

            <label for="">Name</label><br>
            <input type="text" id="Name"><br><br>

            <label for="">School</label><br>
            <input type="text" id="school"><br><br>

            <label for="">Class</label><br>
            <select name="class" id="class">
                <option value="1">1</option>

                <option value="2">2</option>

                <option value="3">3</option>

                <option value="4">4</option>

                <option value="5">5</option>

                <option value="6">6</option>

                <option value="7">7</option>

                <option value="8">8</option>

                <option value="9">9</option>

                <option value="10">10</option>

            </select><br><br>

            <label for="">Roll</label><br>
            <input type="text" id="Roll"><br><br>
            
            <label for="">Date of birth</label><br>
            <input type="date" name="date of birth" id="date of birth"><br><br>

            <label for="">Father's Name</label><br>
            <input type="text" id="Father name"><br><br>

            <label for="">Mother's Name</label><br>
            <input type="text" id="Mothername"><br><br>

            <label for="">Nationality</label><br>
            <select name="Nationality" id="nationality">
                
                <option value="Bangladeshi">Bangladeshi</option>

                <option value="Indian">Indian</option>

                <option value="Pakistani">Pakistani</option>

                <option value="Etc">etc.</option>

            </select><br><br>

            <label for="">Religion</label><br>
            <select name="Religion id=" religion">

                <option value="Muslim">Muslim</option>

                <option value="Hindu">Hindu</option>

                <option value="Chistian">Chistian</option>

                <option value="Etc">etc.</option>

            </select><br><br>

            <label for="">Place</label><br>
            <input type="text" id="place"><br><br>

            <label for="">Phone Number(This will be hidden)</label><br>
            <input type="password" name="number" id="number"><br><br>

            <label for="">Blood Group</label>
            <select name="Blood" id="Blood">

                <option value="A+">A+</option>

                <option value="A-">A-</option>

                <option value="B+">B+</option>

                <option value="B-">B-</option>

            </select> <br><br>

            <input type="submit" value="Submit">

        </fieldset>
    </form>
</body>

</html>
