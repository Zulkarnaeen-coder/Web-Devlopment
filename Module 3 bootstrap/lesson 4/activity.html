<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="text-center">Buttons</h1>
    <button type="button" class="btn btn-success">Click me</button>

    <button type="button" class="btn btn-info" disabled>Click me</button><br>]

    <button type="button" class="btn btn-danger btn-lg">Help me</button>

    <button type="button" class="btn btn-primary btn-sm">Help me!</button>

    <button type="button" class="btn  btn-outline-warning">Click me</button>
    <h1 class="text-center">Badges</h1>
    <button type="button " class="btn position-relative btn-info">
        Inbox
        <span class="position-absolute top-0 start-100 bg-danger translate-middle badge rounded-pill">99+</span>
    </button><br><br>
    <button type="button" class="btn position-relative btn-info">
        Zulkarnaeen
        <span
            class="position-absolute top-0 start-100 bg-success p-2 translate-middle border border-light rounded-circle"></span>
    </button>
    <h1>Progress bar</h1><br><br>
    <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0"
        aria-valuemax="100">
        <div class="progress-bar" style="width: 25%">25%</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
