<!DOCTYPE html>
<html>
    <body>
        <h1>Javascript arrow function</h1>
        <p>Arrow Function help us to write function in a shorter way</p>
        <p id="result">The result is </p>
        <script>
            add = (a,b)=>(a+b);
            document.getElementById("result").innerHTML += add(5,10)
        </script>
    </body>
</html>
