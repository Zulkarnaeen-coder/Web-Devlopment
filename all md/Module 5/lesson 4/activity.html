<!DOCTYPE html>
<html>
    <body>
        <h1>Type Conversion</h1>
        <p id="num1">The first number is </p>
        <p id="num2">The second number is </p>
        <p id="result">The addition is </p>
        <p id="string">After converting string,the number is </p>
        <script>
            let num1 = 90
            let num2 = 80
            document.getElementById("num1").innerHTML += num1;
            document.getElementById("num2").innerHTML += num2;
            document.getElementById("result").innerHTML += num1 + num2 ;
            document.getElementById("string").innerHTML += String(num1)+String(num2);
        </script>
    </body>
</html>
