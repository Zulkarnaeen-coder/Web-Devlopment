<!DOCTYPE html>
<html>
    <body>
        <h1>Generating ramdom numbers</h1>
        <p id="num"></p>
        <script>
            var text ="";
            var i = 0;
            while (i<=10){
                text += "<br>the number is "+i;i++;
            }
            document.getElementById("num").innerHTML = text;
        </script>
    </body>
</html>
