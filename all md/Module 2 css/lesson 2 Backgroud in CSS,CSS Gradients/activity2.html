<!DOCTYPE html>
<html>
    <head>
        <title>CSS GRADIENTS</title>
        <style>
            #grad1 {
                height: 300px;
                background:linear-gradient(to bottom right,red,yellow,green)
            }
            #grad2 {
                height: 300px;
                background:radial-gradient(Red 5% ,green 70%,yellow 25%)
            }

        </style>
    </head>
    <body>
        <H1 id="grad1">CSS Linear Gradient</H1>
        <h1 id="grad2">CSS Radial Gradient</h1>
    </body>
</html>
