<!DOCTYPE html>
<html>

<head></head>

<body>
    <script>
        document.write("Random sets of numbers" + "<br>");
        for (var i = 0; i <= 10; i++) {
            var ran = Math.random(10);
            document.write(ran.toFixed(2) + "<br>");
        }

        var today = new Date();
        document.write("the current date:");
        document.write(today.toDateString());


    </script>
</body>

</html>
