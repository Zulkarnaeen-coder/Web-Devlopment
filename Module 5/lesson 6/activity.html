<!DOCTYPE html>
<html>
    <head></head>
<body>
    <form name="myForm" onsubmit="validateform()">
        <label for="">Name:</label>
        <input type="text" name="Fullname" id="fullname">
        <input type="submit" value="submit"></input>
        <p id="alert"></p>
    </form>
    <script>
        function validateform(){
            let name = document.forms["myForm"]["Fullname"].value;
            if (name == ""){
                document.getElementById("alert").innerHTML = "name must be filled!"
                return false;
            }
            else{
                document.getElementById("alert").innerHTML = "Form successfully submitted!"
                return true;
            }
        }
    </script>
</body>
</html>
