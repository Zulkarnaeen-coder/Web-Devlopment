<!DOCTYPE html>
<html>
    <body>
        <h1>Generating a set of random numbers</h1>
        <p id="num"></p>
        <script>
            var inum = Math.floor(Math.random() * 10.5)
            var text ="";
            var i = inum;
            while (i<=100){
                text += "<br>the number is "+i;i++;
            }
            document.getElementById("num").innerHTML = text;
        </script>
    </body>
</html>
