<!DOCTYPE html>
<html>

<body>
    <h1>Async/Await</h1>
    <p id="result"></p>
    <script>
        async function add(a,b,c,d) {
            let respons = await a + b *c-d;
            display(respons)
        }
        function display(results) {
            document.getElementById("result").innerHTML = results;
        }
        add(3,4,6,9);
    </script>
</body>

</html>
