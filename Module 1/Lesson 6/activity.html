<!DOCTYPE html>
<html>
    <head>
        <title>Form In Html</title>
    </head>
    <body>
        <form action="">
            <fieldset>
                <legend>
                    <h2>Personal details</h2>
                </legend>
                <label for="">Name</label><br>

                <input type="text" id="name"><br><br>
                
                <label for="">Email</label><br>
                <input type="text" id="email"><br><br>
                <label for="">Number(This will be hidden)</label><br>
                <input type="password" id="Number"><br><br>
                <label>Gender</label><br>
                <input type="radio" name="Female" id="female">Female <br>
                <input type="radio" name="Male" id="male">Male <br><br>
                <label for="">Date Of Birth</label> <br>
                <input type="date" name="Date of Birth" id="Date of Birth"> <br><br>
                <label for="">Country</label><br>
                <input type="checkbox" name="Bangladesh" id="Bangladesh">Bangladesh <br>
                <input type="checkbox" name="Canada" id="Canada">Canada <br>
                <input type="checkbox" name="United State" id="United State">United State<br><br>
                <label for="">Blood Group</label>
                <select name="Blood" id="Blood">                    <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                </select> <br><br>
                <input type="submit" value="Submit">

            </fieldset>
        </form>
    </body>
</html>
